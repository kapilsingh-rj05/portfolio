<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kapil Singh — Electronics & Software Portfolio</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f5;--panel:#fff;--ink:#12203a;--mute:#56647c;--line:#cfd8e3;--sig:#0b8f80;--amb:#c77d00;--chip:#e0e8ef;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a2b;--panel:#16243a;--ink:#e8eef7;--mute:#98a7bf;--line:#2a3b56;--sig:#3fd0bd;--amb:#f2b53d;--chip:#1f3050}}
:root[data-theme="dark"]{--bg:#0f1a2b;--panel:#16243a;--ink:#e8eef7;--mute:#98a7bf;--line:#2a3b56;--sig:#3fd0bd;--amb:#f2b53d;--chip:#1f3050}
html{scroll-behavior:smooth;scroll-padding-top:70px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.65 'IBM Plex Sans',system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque','IBM Plex Sans',sans-serif;line-height:1.1;margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--sig);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;gap:18px;height:56px;overflow-x:auto}
nav b{font-family:'Bricolage Grotesque',sans-serif;font-size:19px;margin-right:auto;white-space:nowrap}
nav a{text-decoration:none;color:var(--mute);font-size:14px;font-weight:500;white-space:nowrap}
nav a:hover{color:var(--ink)}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:36px;align-items:center;padding:64px 0 48px}
.hero h1{font-size:clamp(44px,7.5vw,84px);font-weight:800;letter-spacing:-.03em}
.hero p{color:var(--mute);max-width:46ch;font-size:18px;margin:18px 0 26px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:10px 20px;border-radius:8px;font-weight:600;text-decoration:none;border:1.5px solid var(--ink);font-size:15px}
.btn.main{background:var(--ink);color:var(--bg)}
.scope{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.scope svg{width:100%;height:auto;display:block}
.tog{display:flex;gap:6px;margin-top:10px}
.tog button,.tabs button{font:500 14px 'IBM Plex Sans',sans-serif;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--mute);cursor:pointer}
.tog button[aria-pressed=true],.tabs button[aria-pressed=true]{background:var(--sig);border-color:var(--sig);color:#fff}
.cap{font-size:13px;color:var(--mute);margin-top:8px}
section{padding:54px 0;border-top:1px solid var(--line)}
h2{font-size:clamp(28px,4vw,40px);font-weight:700;letter-spacing:-.02em;margin-bottom:26px}
.about{display:grid;grid-template-columns:1.4fr 1fr;gap:36px}
.stats{display:grid;gap:14px}
.stat{border-left:3px solid var(--sig);padding-left:14px}
.stat strong{font:800 30px 'Bricolage Grotesque',sans-serif;display:block}
.stat span{color:var(--mute);font-size:14px}
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px}
.card h3{font-size:20px}
.card ul{margin:0;padding-left:18px;color:var(--mute);font-size:15px}
.card li{margin-bottom:4px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.tag{background:var(--chip);border-radius:6px;padding:2px 9px;font-size:12.5px;font-weight:500}
.kind{font-size:13px;font-weight:600;color:var(--amb)}
.kind.sw{color:var(--sig)}
.tl{border-left:2px solid var(--line);padding-left:22px;margin-left:6px}
.tl div{margin-bottom:26px;position:relative}
.tl div:before{content:"";position:absolute;left:-29px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--sig);border:3px solid var(--bg)}
.tl small{color:var(--mute)}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.skills h3{font-size:17px;margin-bottom:8px}
.tags.f{margin:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:36px}
.two ul{padding-left:18px;margin:0}.two li{margin-bottom:10px}
footer{padding:54px 0 70px;border-top:1px solid var(--line)}
footer h2{margin-bottom:12px}
footer p{color:var(--mute);margin:0 0 20px}
@media(max-width:760px){.hero,.about,.two{grid-template-columns:1fr}.hero{padding-top:36px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

.avatar{position:relative;width:148px;height:148px;margin-bottom:22px}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;border-radius:50%;display:block;border:4px solid var(--bg);position:relative;animation:pop .9s cubic-bezier(.2,1.4,.4,1) both}
.avatar:before{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px dashed var(--sig);animation:spin 18s linear infinite}
.avatar:after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid transparent;border-top-color:var(--amb);animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes blink{50%{opacity:0}}
.hero h1 span{display:inline-block;animation:rise .7s cubic-bezier(.2,.9,.3,1) both}
.role{font:600 20px 'Bricolage Grotesque',sans-serif;color:var(--sig);margin:10px 0 0;min-height:30px}
.role i{display:inline-block;width:2px;height:1em;background:var(--amb);margin-left:3px;vertical-align:-2px;animation:blink 1s steps(1) infinite}
.bar{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--sig),var(--amb));z-index:10}
.rv{opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s ease}
.rv.in{opacity:1;transform:none}
.card{animation:rise .5s ease both;transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease}
.card:hover{transform:translateY(-6px);border-color:var(--sig);box-shadow:0 12px 28px rgba(11,143,128,.18)}
.tag{transition:transform .2s ease,background .2s ease,color .2s ease}
.tag:hover{transform:translateY(-2px) scale(1.06);background:var(--sig);color:#fff}
.btn{transition:transform .2s ease,box-shadow .2s ease}
.btn:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(0,0,0,.18)}
.tl div:before{animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--sig)}70%,100%{box-shadow:0 0 0 10px transparent}}
.stat{transition:transform .25s ease}.stat:hover{transform:translateX(6px)}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
.lab{font:700 11px 'IBM Plex Sans',sans-serif;letter-spacing:.08em}
.code{margin-top:10px;background:var(--chip);border-radius:10px;padding:12px 14px;min-height:98px;position:relative}
.code pre{margin:0;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;color:var(--ink)}
.code pre i{display:inline-block;width:7px;height:14px;background:var(--amb);vertical-align:-2px;animation:blink 1s steps(1) infinite}
.chip2{position:absolute;top:8px;right:10px;font-size:11px;font-weight:600;color:var(--sig)}
.orbit{position:relative;width:340px;height:340px;max-width:100%;margin:0 auto}
.ring{position:absolute;left:50%;top:50%;margin:0;border-radius:50%;border:1.5px dashed var(--line);translate:-50% -50%}
.slot{position:absolute;left:50%;top:50%;width:0;height:0}
.slot>div>div{width:0;height:0}
.pill{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-size:12.5px;font-weight:600;padding:4px 11px;border-radius:999px;background:var(--panel);border:2px solid var(--amb);color:var(--ink);transition:background .2s,color .2s}
.o2 .pill{border-color:var(--sig)}
.pill:hover{background:var(--ink);color:var(--bg)}
.core{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:linear-gradient(90deg,var(--amb) 50%,var(--sig) 50%);display:grid;place-items:center;animation:beat 2.6s ease-in-out infinite}
.core span{font:800 26px 'Bricolage Grotesque',sans-serif;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35)}
@keyframes beat{50%{transform:scale(1.08)}}
.orbit:hover *{animation-play-state:paused}
.legend{display:flex;gap:18px;justify-content:center;font-size:13px;font-weight:600;margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.scope .cap{text-align:center}
.stage{height:270px;perspective:1000px;display:grid;place-items:center;overflow:hidden}
.iso{position:relative;width:170px;height:170px;transform-style:preserve-3d;transform:rotateX(58deg) rotateZ(-38deg);margin-top:10px}
.plate{position:absolute;inset:0;border:3px solid var(--c);border-radius:14px;background:color-mix(in srgb,var(--c) 16%,var(--panel));transform:translateZ(var(--z));transition:transform .7s cubic-bezier(.3,1.4,.5,1),box-shadow .5s,background .5s;transform-style:preserve-3d}
.plate span{position:absolute;inset:14px;border-radius:6px;opacity:.75}
.p0 span{background:repeating-linear-gradient(0deg,var(--c) 0 2px,transparent 2px 14px),repeating-linear-gradient(90deg,var(--c) 0 2px,transparent 2px 14px)}
.p1 span{background:radial-gradient(circle,var(--c) 3px,transparent 4px) 0 0/22px 22px}
.p2 span{background:repeating-linear-gradient(0deg,var(--c) 0 5px,transparent 5px 16px);-webkit-mask:linear-gradient(90deg,#000 70%,transparent);mask:linear-gradient(90deg,#000 70%,transparent)}
.plate.act{background:color-mix(in srgb,var(--c) 34%,var(--panel));box-shadow:0 0 34px var(--c)}
.layers{display:grid;gap:6px;margin-top:6px}
.layers button{display:grid;grid-template-columns:12px 80px 1fr;align-items:center;gap:8px;text-align:left;font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;transition:background .3s,border-color .3s}
.layers button.on{background:var(--chip);border-color:var(--sig)}
.layers i{width:10px;height:10px;border-radius:50%}
.layers small{color:var(--mute);font-size:12.5px}
.bob{animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.beam{position:absolute;width:0;height:170px;border-left:2px dashed var(--line);transform-origin:0 0;transform:rotateX(90deg)}
.dot{position:absolute;width:10px;height:10px;margin:-5px;border-radius:50%;animation:climb 3.3s ease-in infinite;opacity:0;box-shadow:0 0 12px currentColor}
@keyframes climb{0%{transform:translateZ(0);opacity:0;background:var(--amb);color:var(--amb)}15%{opacity:1}55%{background:#6a7be0;color:#6a7be0}100%{transform:translateZ(175px);opacity:0;background:var(--sig);color:var(--sig)}}
.cgrid{display:grid;grid-template-columns:1fr 1.1fr;gap:28px;margin-top:8px}
.cinfo p{margin:14px 0 18px;max-width:44ch}
.status{display:inline-flex;align-items:center;gap:9px;background:var(--chip);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600}
.status i{width:10px;height:10px;border-radius:50%;background:#2ecc71;animation:ping 1.8s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(46,204,113,.7)}100%{box-shadow:0 0 0 11px rgba(46,204,113,0)}}
.clink{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;text-decoration:none;transition:transform .2s,border-color .2s}
a.clink:hover,.clink:hover{border-color:var(--sig);transform:translateX(4px)}
.clink small{display:block;color:var(--mute);font-size:12.5px}
.clink b{display:block;font-size:15px;word-break:break-all}
.clink button,.clink span{font:600 13px 'IBM Plex Sans',sans-serif;padding:6px 14px;border-radius:999px;border:1px solid var(--sig);color:var(--sig);background:transparent;cursor:pointer;white-space:nowrap}
.clink button:hover{background:var(--sig);color:#fff}
.composer{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:14px}
.topics{display:flex;gap:8px;flex-wrap:wrap}
.topics button{font:500 13.5px 'IBM Plex Sans',sans-serif;padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--mute);cursor:pointer}
.topics button[aria-pressed=true]{background:var(--sig);border-color:var(--sig);color:#fff}
.composer label{display:grid;gap:6px;font-size:14px;font-weight:600}
.composer input,.composer textarea{font:400 15px 'IBM Plex Sans',sans-serif;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical;width:100%}
.composer input:focus,.composer textarea:focus{outline:2px solid var(--sig);border-color:transparent}
.send{cursor:pointer;font-family:inherit;justify-self:start}
.note{color:var(--mute);font-size:12.5px}
.copy{margin-top:40px;color:var(--mute);font-size:13px}
@media(max-width:760px){.cgrid{grid-template-columns:1fr}}
.globe{position:relative;height:340px;overflow:hidden;cursor:grab;touch-action:pan-y}
.glow{position:absolute;left:calc(50% - 115px);top:calc(50% - 115px);width:230px;height:230px;border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--sig) 28%,transparent),color-mix(in srgb,var(--amb) 14%,transparent) 55%,transparent 72%);animation:beat 4s ease-in-out infinite}
.w{position:absolute;left:50%;top:50%;font:600 14px 'IBM Plex Sans',sans-serif;padding:3px 10px;border-radius:999px;background:var(--panel);border:1.5px solid var(--amb);color:var(--ink);white-space:nowrap;will-change:transform}
.w.sw{border-color:var(--sig)}
.wire{position:absolute;left:50%;top:0;width:340px;height:340px;margin-left:-170px;pointer-events:none}
.bridge{stroke-dasharray:5 6;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-11}}
.w.hot{background:var(--ink);color:var(--bg)}
.legend .ln{width:18px;height:0;border-top:2px dashed var(--sig);border-radius:0;background:none!important}
.scope .info{min-height:22px}
.composer{transition:border-color .3s,box-shadow .3s}
.composer:focus-within{border-color:var(--sig);box-shadow:0 0 0 4px color-mix(in srgb,var(--sig) 18%,transparent)}
.count{color:var(--mute);font-weight:400;justify-self:end}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{font:600 14px 'IBM Plex Sans',sans-serif;cursor:pointer;background:transparent;color:var(--ink);padding:9px 16px}
.actions .btn.main{background:var(--ink);color:var(--bg)}
.toast{font-size:13.5px;color:var(--mute);min-height:22px;transition:color .3s}
.toast.ok{color:var(--sig);font-weight:600}.toast.bad{color:#d64545;font-weight:600}
.globe{position:relative;overflow:hidden;cursor:default;height:340px}
.gstage{position:absolute;left:50%;top:0;width:340px;height:340px;margin-left:-170px;transform-origin:50% 0}
.scope svg.wire{position:absolute;left:0;top:0;width:340px;height:340px;margin:0;pointer-events:none}
.cc{text-align:center}
.cc p{color:var(--mute);margin:0 auto 30px;max-width:52ch}
.icons{display:flex;justify-content:center;gap:30px;flex-wrap:wrap;margin-bottom:32px}
.ic{display:flex;flex-direction:column;align-items:center;gap:10px;text-decoration:none;color:var(--ink);max-width:130px}
.ib{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);background:var(--panel);transition:transform .25s,background .25s,color .25s,border-color .25s}
a.ic:hover .ib{transform:translateY(-6px) scale(1.06);background:var(--sig);border-color:var(--sig);color:#fff}
.il{font-size:14px;font-weight:600}
.globe{cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.globe.grabbing{cursor:grabbing}
.w{cursor:pointer;transition:background .2s,color .2s}
.w.off{pointer-events:none}
.w.hw.sel{background:var(--amb);color:#fff}
.w.sw.sel{background:var(--sig);color:#fff}
.scope .tog{justify-content:center;margin-top:8px}
.scope .cap.info{text-align:center}
</style>
</head>

function Count({to,dec=0,suffix=""}){
  const [v,setV]=useState(0),r=useRef();
  useEffect(()=>{
    const io=new IntersectionObserver(([e])=>{if(!e.isIntersecting)return;io.disconnect();
      const t0=performance.now();const f=t=>{const p=Math.min((t-t0)/1400,1);setV(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)});
    io.observe(r.current);return()=>io.disconnect();
  },[]);
  return html`<strong ref=${r}>${v.toFixed(dec)}${suffix}</strong>`;
}
function Typer(){
  const roles=["Embedded systems tinkerer","VLSI and Verilog learner","Full-stack developer","AI and RAG builder"];
  const [t,setT]=useState("");
  useEffect(()=>{
    let i=0,c=0,del=false,id;
    const tick=()=>{
      const w=roles[i];
      c+=del?-1:1;setT(w.slice(0,c));
      let ms=del?35:70;
      if(!del&&c===w.length){del=true;ms=1400}
      else if(del&&c===0){del=false;i=(i+1)%roles.length;ms=350}
      id=setTimeout(tick,ms);
    };
    tick();return()=>clearTimeout(id);
  },[]);
  return html`<div class="role" aria-label="Roles">${t}<i></i></div>`;
}

  const USED={"Verilog":"RISC-V processor, FIFO, voting machine","SystemVerilog":"Verification with UVM","UVM":"Verification skills","RISC-V":"Single-cycle processor in Verilog","FPGA":"BASYS 3 board projects","ESP32":"Smart dustbin and WiFi clock","Arduino":"RC car and club workshops","Raspberry Pi":"Voice assistant and face recognition","Cadence":"Two-stage CMOS op-amp","HFSS":"Electromagnetic simulation","MATLAB":"Signal processing work","IoT":"Smart dustbin with ThingSpeak","React":"Prodigy InfoTech internship","Node.js":"Backend and web apps","Python":"DocHelp, face recognition, Manim","FastAPI":"Backend APIs","MongoDB":"Database work","MySQL":"Database work","LangChain":"DocHelp RAG system","RAG":"DocHelp document Q&A","JavaScript":"Electron and React internship","C++":"Core language and DSA","Git":"Version control on GitHub","DSA":"400+ problems solved"};
  const BR=[["Raspberry Pi","Python"],["ESP32","Node.js"],["Arduino","C++"],["IoT","MongoDB"],["MATLAB","Python"],["Verilog","C++"],["FPGA","JavaScript"]];
  const N=W.length,R=128,C=170,idx=Object.fromEntries(W.map((w,i)=>[w[0],i]));
  const pts=useRef(W.map((_,i)=>{const y=1-(i/(N-1))*2,r=Math.sqrt(1-y*y),th=i*2.399963;return[Math.cos(th)*r,y,Math.sin(th)*r]})).current;
  const rings=useRef((()=>{const o=[];for(const y0 of[-.55,0,.55]){const r=Math.sqrt(1-y0*y0);o.push(Array.from({length:49},(_,k)=>{const t=k/48*6.2832;return[Math.cos(t)*r,y0,Math.sin(t)*r]}))}
    for(const p of[0,1.5708])o.push(Array.from({length:49},(_,k)=>{const t=k/48*6.2832;return[Math.cos(t)*Math.cos(p),Math.sin(t),Math.cos(t)*Math.sin(p)]}));return o})()).current;
  const st=useRef({ax:0.3,ay:0,vx:0,vy:0.006,tx:0,ty:0.006,drag:null,moved:0,focus:null,hover:false}).current;
  const [,tick]=useState(0),[info,setInfo]=useState(null),[sel,setSel]=useState(null),[flt,setFlt]=useState("all"),[grab,setGrab]=useState(false),[k,setK]=useState(1),gref=useRef(null);
  const still=useRef(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches).current;
  const base=still?0:0.006;
  useEffect(()=>{const el=gref.current;if(!el)return;const fit=()=>setK(Math.min(1,el.clientWidth/340));fit();const ro=new ResizeObserver(fit);ro.observe(el);return()=>ro.disconnect()},[]);
  useEffect(()=>{

    id=requestAnimationFrame(f);return()=>cancelAnimationFrame(id);
  },[]);
  const down=e=>{st.drag={x:e.clientX,y:e.clientY};st.moved=0;st.cap=false};
  const move=e=>{if(!st.drag)return;const dx=e.clientX-st.drag.x,dy=e.clientY-st.drag.y;if(st.moved<=5&&st.focus!==null){}st.drag={x:e.clientX,y:e.clientY};st.moved+=Math.abs(dx)+Math.abs(dy);if(st.moved>5&&!st.cap){st.cap=true;st.focus=null;setSel(null);setGrab(true);try{e.currentTarget.setPointerCapture(e.pointerId)}catch(_){}}
    st.ay+=dx*0.011;st.ax+=dy*0.011;st.vy=dx*0.011;st.vx=dy*0.011};
  const up=()=>{st.drag=null;setGrab(false);st.tx=0;st.ty=st.hover?0:base};
  const enter=()=>{st.hover=true;st.tx=0;st.ty=0};

  const pick=i=>{if(st.moved>5)return;if(st.focus===i){st.focus=null;setSel(null)}else{st.focus=i;setSel(W[i][0])}};
  const cy=Math.cos(st.ay),sy=Math.sin(st.ay),cx=Math.cos(st.ax),sx=Math.sin(st.ax);
  const rot=([x,y,z])=>{const x1=x*cy+z*sy,z1=-x*sy+z*cy;return[x1,y*cx-z1*sx,y*sx+z1*cx]};
  const P=pts.map(rot);

      </div>
    </div>
    <div class="tog">${[["all","All"],["hw","Hardware"],["sw","Software"]].map(([v,l])=>html`<button key=${v} aria-pressed=${flt===v} onClick=${()=>setFlt(v)}>${l}</button>`)}</div>
    <div class="cap info" aria-live="polite">${shown?html`<b>${shown}:</b> ${USED[shown]}`:"Drag to spin it. Click a skill to bring it to the front."}</div>
  </div>`;
}
